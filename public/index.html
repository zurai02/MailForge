<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MailForge</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div class="login-screen" id="loginScreen">
  <div class="login-card">
    <div class="brand"><span class="dot"></span><span class="name">MailForge</span></div>
    <form id="loginForm">
      <div class="field">
        <label for="loginEmail">Email</label>
        <input type="email" id="loginEmail" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="loginPassword">Password</label>
        <input type="password" id="loginPassword" autocomplete="current-password" required>
      </div>
      <button class="btn" type="submit" style="width:100%; justify-content:center;">Sign in</button>
      <div class="error-text" id="loginError"></div>
    </form>
  </div>
</div>

<div class="app" id="app">
  <aside class="sidebar">
    <div class="brand"><span class="dot"></span><span class="name">MailForge</span></div>
    <div class="nav-item active" data-view="domains">Domains</div>
    <div class="sidebar-footer">
      <button class="logout-btn" id="logoutBtn">Sign out</button>
    </div>
  </aside>

  <main>
    <section class="view active" id="view-domains">
      <h1>Domains</h1>
      <p class="subtitle">Add a domain and verify you own it with a TXT record.</p>

      <div class="card">
        <form id="addDomainForm" class="inline-form" style="margin-top:0;">
          <input type="text" id="newDomainInput" placeholder="example.com" required>
          <button class="btn" type="submit">Add domain</button>
        </form>
        <div class="error-text" id="addDomainError"></div>
      </div>

      <div id="domainsList"></div>
    </section>

    <section class="view" id="view-domain-detail">
      <button class="back-link" id="backToDomains">&larr; All domains</button>
      <h1 id="detailDomainName"></h1>
      <p class="subtitle" id="detailDomainStatus"></p>

      <div id="verifyBlock"></div>

      <div id="verifiedBlock" style="display:none;">
        <div class="card">
          <p style="margin:0; color:var(--teal); font-size:14px;">This domain is verified.</p>
          <div class="btn-row">
            <button class="btn danger" id="deleteVerifiedDomainBtn">Remove domain</button>
          </div>
        </div>
      </div>
    </section>
  </main>
</div>

<div class="toast" id="toast"></div>

<script src="/js/app.js"></script>
</body>
</html>
